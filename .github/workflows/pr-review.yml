# Workflow: AI pull request review
# Posts one review (summary + inline comments) per pull request, similar to the
# MySQL "Codex PR Review" bot.
#
# Trigger:
#   - pull_request_target: opened / synchronize / reopened / ready_for_review
#   - issue_comment: a trusted user comments "/review" on a PR
#   - workflow_dispatch: manual run for a given PR number
#
# Notes:
#   - pull_request_target is required so fork PRs can be commented on. The
#     workflow only checks out the trusted base branch and reads the diff
#     through the GitHub API; PR code is never checked out or executed.
#   - Requires the repository secret PR_REVIEW_API_KEY (any OpenAI-compatible
#     provider). Optional variables PR_REVIEW_BASE_URL and PR_REVIEW_MODEL
#     select a provider other than OpenAI.
#
#    Copyright (c) 2026 Shannon Data AI and/or its affiliates.
name: AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.draft == false &&
        !endsWith(github.event.pull_request.user.login, '[bot]') &&
        !contains(github.event.pull_request.labels.*.name, 'skip-ai-review')) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run AI review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          PR_REVIEW_API_KEY: ${{ secrets.PR_REVIEW_API_KEY }}
          PR_REVIEW_BASE_URL: ${{ vars.PR_REVIEW_BASE_URL }}
          PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL }}
          FORCE_REVIEW: ${{ (github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: python3 .github/scripts/pr_review.py
